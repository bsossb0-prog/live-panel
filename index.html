<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Live Control Center</title>
  <style>
    :root {
      --bg: #040816;
      --bg-2: #0a1024;
      --panel: rgba(12, 19, 46, 0.78);
      --border: rgba(113, 147, 255, 0.22);
      --text: #f4f7ff;
      --muted: #9eabd1;
      --cyan: #35e8ff;
      --blue: #4a7dff;
      --purple: #bc52ff;
      --pink: #ff5cbc;
      --green: #3ef2a2;
      --red: #ff5b77;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Inter, "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, rgba(188, 82, 255, 0.25), transparent 28%),
                  radial-gradient(circle at bottom center, rgba(53, 232, 255, 0.12), transparent 25%),
                  linear-gradient(145deg, #02050e 0%, #07102a 45%, #030814 100%);
      display: flex; justify-content: center; align-items: center; padding: 20px;
    }

    #loginPage {
      position: fixed; inset: 0; display: flex; justify-content: center; align-items: center;
      z-index: 1000; background: rgba(3, 4, 12, 0.9); backdrop-filter: blur(20px);
    }
    .login-shell {
      width: min(400px, 100%); padding: 2px; border-radius: 30px;
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .login-box {
      background: #0a1024; border-radius: 29px; padding: 40px 30px; text-align: center;
    }
    .logo-badge {
      width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 20px;
      display: grid; place-items: center; font-size: 35px;
      background: linear-gradient(135deg, #ffd84c, #ffb100);
    }
    .login-box h1 { margin: 0; font-size: 28px; text-transform: uppercase; letter-spacing: 3px;
      background: linear-gradient(90deg, #4de8ff, #ff82d5); -webkit-background-clip: text; color: transparent; }
    .login-subtitle { color: var(--muted); font-size: 14px; margin: 10px 0 25px; }
    .form-field { margin-bottom: 15px; text-align: left; }
    .field-label { display: block; margin-bottom: 8px; font-size: 12px; color: #a7b7e3; text-transform: uppercase; }
    .text-input { width: 100%; min-height: 50px; padding: 0 15px; border-radius: 12px; border: 1px solid rgba(135,160,255,0.2);
      background: rgba(255,255,255,0.05); color: #fff; outline: none; }
    .login-btn { width: 100%; min-height: 55px; border: none; border-radius: 15px; cursor: pointer; font-weight: 800;
      text-transform: uppercase; background: linear-gradient(90deg, var(--cyan), var(--purple)); color: #050713; }

    #mainPanel { display: none; width: min(100%, 600px); position: relative; }
    .panel {
      background: linear-gradient(180deg, rgba(11,18,42,.98), rgba(9,15,34,.88));
      padding: 30px; border-radius: 32px; border: 1px solid rgba(145,167,255,.14);
      box-shadow: var(--shadow); backdrop-filter: blur(10px);
    }
    .hero h2 { text-align: center; font-size: 32px; color: var(--cyan); text-transform: uppercase; margin-bottom: 20px; }
    
    /* Glowing Live Ring */
    .timer-card {
      text-align: center; margin-bottom: 25px; padding: 20px;
      border-radius: 24px; border: 1px solid rgba(53,232,255,0.3);
      background: rgba(53,232,255,0.05); display: flex; align-items: center; justify-content: space-around;
    }
    .live-ring {
      width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--cyan);
      display: grid; place-items: center; font-weight: 900; color: var(--cyan);
      box-shadow: 0 0 20px var(--cyan); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
    #statusText { color: var(--green); font-size: 16px; font-weight: 700; display: block; }
    #timer { font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 0 20px var(--cyan); font-family: monospace; }
    
    .input-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    .card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
    .card-title { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
    
    select, .text-input { width: 100%; padding: 12px; border-radius: 12px; background: #0a1024; color: #fff; border: 1px solid rgba(135,160,255,0.2); outline: none; }
    
    .mode-options { display: flex; gap: 10px; }
    .mode-opt { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(135,160,255,0.2); background: rgba(255,255,255,0.03); 
      cursor: pointer; text-align: center; font-size: 13px; transition: 0.3s; color: #fff; }
    .mode-opt.active { background: var(--blue); border-color: var(--cyan); box-shadow: 0 0 15px rgba(53,232,255,0.3); }
    
    .loop-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 12px; }
    .loop-wrap input { width: 18px; height: 18px; accent-color: var(--cyan); }
    .loop-wrap label { font-size: 14px; color: var(--cyan); font-weight: 700; cursor: pointer; }

    .start-btn { width: 100%; min-height: 60px; margin-top: 25px; border: none; border-radius: 20px; cursor: pointer;
      font-weight: 900; text-transform: uppercase; font-size: 18px; color: #050713;
      background: linear-gradient(90deg, var(--cyan), var(--purple)); box-shadow: 0 10px 25px rgba(0,229,255,0.3); }
    .stop-btn { width: 100%; min-height: 60px; border: none; border-radius: 20px; cursor: pointer;
      font-weight: 900; text-transform: uppercase; font-size: 18px; color: #fff;
      background: linear-gradient(90deg, var(--red), #ff7b2f); box-shadow: 0 10px 25px rgba(255,59,95,0.3); }

    .logout-btn { position: absolute; top: 20px; right: 20px; padding: 6px 12px; border-radius: 10px; 
      border: 1px solid var(--red); color: var(--red); background: rgba(255,59,95,0.1); cursor: pointer; font-size: 12px; }
    
    .progress-box { display: none; margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 15px; text-align: center; }
    .prog-bar { height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin: 10px 0; }
    .prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--purple)); transition: 0.3s; }
    #progText { font-size: 13px; color: var(--cyan); }
    .hidden { display: none; }
  </style>
</head>
<body>

<div id="loginPage">
    <div class="login-shell">
        <div class="login-box">
            <div class="logo-badge">⚡</div>
            <h1>Live Panel</h1>
            <p class="login-subtitle">Premium Access Control</p>
            <div class="form-field">
                <label class="field-label">Username</label>
                <input type="text" id="username" class="text-input" placeholder="Enter username">
            </div>
            <div class="form-field">
                <label class="field-label">Password</label>
                <input type="password" id="password" class="text-input" placeholder="Enter password">
            </div>
            <button class="login-btn" onclick="login()">Enter Dashboard</button>
        </div>
    </div>
</div>

<div id="mainPanel">
    <button class="logout-btn" onclick="logout()">Logout</button>
    <div class="panel">
        <div class="hero"><h2>LIVE PANEL</h2></div>
        
        <div class="timer-card">
            <div class="live-ring">LIVE</div>
            <div style="text-align:left">
                <span id="statusText">Ready to Stream</span>
                <div id="timer">00:00:00</div>
            </div>
        </div>

        <div id="progressBox" class="progress-box">
            <div class="prog-bar"><div id="progFill" class="prog-bar-fill"></div></div>
            <span id="progText">Uploading... 0% (0 MB)</span>
        </div>

        <div class="input-grid">
            <div class="card">
                <div class="card-title"><span>🎥</span> Source Type</div>
                <select id="sourceType" onchange="toggleSource()">
                    <option value="link">🔗 Video / Dropbox Link</option>
                    <option value="file">📁 Upload Video File</option>
                </select>
            </div>

            <div id="linkInput" class="card">
                <div class="card-title"><span>🔗</span> Video URL</div>
                <input type="text" id="videoSource" class="text-input" placeholder="https://dropbox.com/...">
            </div>

            <div id="fileInput" class="card hidden">
                <div class="card-title"><span>📁</span> Select Video File</div>
                <input type="file" id="videoFile" accept="video/*" style="color: var(--muted); font-size: 13px;">
            </div>

            <div class="card">
                <div class="card-title"><span>📺</span> Live Mode</div>
                <div class="mode-options">
                    <div class="mode-opt active" id="optStd" onclick="setMode('standard')">Standard 16:9</div>
                    <div class="mode-opt" id="optSho" onclick="setMode('shorts')">Shorts 9:16</div>
                </div>
                <input type="hidden" id="liveMode" value="standard">
            </div>

            <div class="card">
                <div class="loop-wrap">
                    <input type="checkbox" id="loopStream">
                    <label for="loopStream">🔄 Loop Video (24/7 Live)</label>
                </div>
            </div>

            <div class="card">
                <div class="card-title"><span>🔴</span> Target Platform</div>
                <select id="platform">
                    <option value="rtmp://a.rtmp.youtube.com/live2">YouTube</option>
                    <option value="rtmps://live-api-s.facebook.com:443/rtmp/">Facebook</option>
                </select>
            </div>

            <div class="card">
                <div class="card-title"><span>🔑</span> Stream Key</div>
                <input type="password" id="streamKey" class="text-input" placeholder="Enter your key...">
            </div>
        </div>

        <div id="buttonArea">
            <button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>
        </div>
    </div>
</div>

<script>
    let timerInterval;
    let startTime;
    let sessionToken = localStorage.getItem('live_token');

    window.onload = async () => {
        if (sessionToken) showPanel();
        try {
            const res = await fetch(`/status?token=${sessionToken}`);
            const data = await res.json();
            if (data.isActive && data.startTime) {
                startTime = data.startTime;
                updateUI(true);
                startSyncTimer();
            }
        } catch (e) {}
    };

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, pass })
        });
        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('live_token', data.token);
            sessionToken = data.token;
            showPanel();
        } else { alert("Wrong Username or Password!"); }
    }

    function showPanel() {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';
    }

    function logout() { localStorage.removeItem('live_token'); location.reload(); }

    function toggleSource() {
        const type = document.getElementById('sourceType').value;
        document.getElementById('linkInput').classList.toggle('hidden', type === 'file');
        document.getElementById('fileInput').classList.toggle('hidden', type === 'link');
    }

    function setMode(m) {
        document.getElementById('liveMode').value = m;
        document.getElementById('optStd').classList.toggle('active', m === 'standard');
        document.getElementById('optSho').classList.toggle('active', m === 'shorts');
    }

    function updateUI(isLive) {
        document.getElementById('statusText').innerText = isLive ? "Status: Live Stream Started!" : "Status: Ready to Stream";
        document.getElementById('buttonArea').innerHTML = isLive ? 
            `<button id="stopBtn" class="stop-btn" onclick="stopStream()">Stop Live Stream</button>` : 
            `<button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>`;
    }

    function startSyncTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const diff = Math.floor((Date.now() - startTime) / 1000);
            const h = Math.floor(diff / 3600), m = Math.floor((diff % 3600) / 60), s = diff % 60;
            document.getElementById('timer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }, 1000);
    }

    async function startStream() {
        const btn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const progBox = document.getElementById('progressBox');
        const progFill = document.getElementById('progFill');
        const progText = document.getElementById('progText');
        const btnArea = document.getElementById('buttonArea');
        
        const type = document.getElementById('sourceType').value;
        const key = document.getElementById('streamKey').value;
        const platform = document.getElementById('platform').value;
        const loop = document.getElementById('loopStream').checked;
        const mode = document.getElementById('liveMode').value;

        if (!key) { alert("Stream Key missing!"); return; }

        const fd = new FormData();
        fd.append('type', type); fd.append('platform', platform); fd.append('key', key);
        fd.append('loop', loop); fd.append('mode', mode); fd.append('token', sessionToken);

        if (type === 'link') fd.append('source', document.getElementById('videoSource').value);
        else {
            const file = document.getElementById('videoFile').files[0];
            if (!file) { alert("Select a file!"); return; }
            fd.append('videoFile', file);
        }

        btn.innerText = "Connecting..."; btn.disabled = true;
        statusText.innerText = "Processing...";

        const xhr = new XMLHttpRequest();
        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const p = Math.round((e.loaded / e.total) * 100);
                const mbL = (e.loaded / (1024*1024)).toFixed(1);
                const mbT = (e.total / (1024*1024)).toFixed(1);
                progBox.style.display = 'block';
                progFill.style.width = p + '%';
                progText.innerText = `Uploading... ${p}% (${mbL}MB / ${mbT}MB)`;
                statusText.innerText = `Uploading... ${p}%`;
            }
        };

        xhr.onload = () => {
            if (xhr.status === 200) {
                alert("Live Started!");
                updateUI(true);
                fetch(`/status?token=${sessionToken}`).then(r => r.json()).then(d => {
                    startTime = d.startTime; startSyncTimer();
                });
            } else {
                alert("Server Error!");
                btn.innerText = "Start Live Stream"; btn.disabled = false;
            }
            setTimeout(() => progBox.style.display = 'none', 3000);
        };

        xhr.open('POST', '/start-stream', true);
        xhr.send(fd);
    }

    async function stopStream() {
        if(!confirm("Stop Live?")) return;
        try {
            const res = await fetch('/stop-stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: sessionToken })
            });
            if (res.ok) {
                alert("Stopped!");
                updateUI(false);
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = "00:00:00";
            }
        } catch (e) { alert("Error!"); }
    }
</script>
</body>
</html>
