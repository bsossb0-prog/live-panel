<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Live Panel</title>
    <style>
        body { background-color: #050510; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .panel { background-color: #111125; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 100%; max-width: 500px; border: 1px solid #1a1a3a; position: relative; }
        h2 { text-align: center; color: #00d2ff; font-size: 24px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .timer-container { text-align: center; margin-bottom: 20px; padding: 15px; border: 2px dashed #00d2ff; border-radius: 15px; background: rgba(0, 210, 255, 0.05); }
        #statusText { color: #aaa; font-size: 14px; margin-bottom: 5px; display: block; }
        #timer { color: #00d2ff; font-size: 32px; font-weight: bold; font-family: monospace; text-shadow: 0 0 10px #00d2ff; }
        .progress-container { display: none; margin-bottom: 20px; text-align: center; }
        .progress-bar-bg { background: #1a1a3a; border-radius: 10px; height: 12px; width: 100%; border: 1px solid #2a2a4a; overflow: hidden; }
        .progress-bar-fill { background: linear-gradient(90deg, #00d2ff, #00a2ff); height: 100%; width: 0%; transition: width 0.2s; }
        #progressPercent { font-size: 13px; color: #00d2ff; margin-top: 5px; display: block; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a3a; color: white; font-size: 14px; box-sizing: border-box; outline: none; }
        .hidden { display: none; }
        .loop-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; background: rgba(0, 210, 255, 0.1); padding: 10px; border-radius: 8px; cursor: pointer; }
        .loop-container input { width: auto; cursor: pointer; }
        .loop-container label { margin-bottom: 0; cursor: pointer; color: #00d2ff; font-weight: bold; }
        .start-btn { width: 100%; padding: 15px; background-color: #00d2ff; border: none; border-radius: 8px; color: #050510; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; margin-top: 20px; transition: 0.3s; }
        .stop-btn { width: 100%; padding: 15px; background-color: #ff4b2b; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; margin-top: 20px; transition: 0.3s; }
        .logout-btn { position: absolute; top: 20px; right: 20px; background: none; border: 1px solid #ff4b2b; color: #ff4b2b; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div id="loginPage" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050510; display: flex; justify-content: center; align-items: center; z-index: 1000;">
    <div class="login-box" style="background: #111125; padding: 40px; border-radius: 20px; border: 1px solid #1a1a3a; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
        <h2 style="color: #00d2ff; margin-bottom: 20px;">User Login</h2>
        <input type="text" id="username" placeholder="Username" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a3a; color: white; box-sizing: border-box;">
        <input type="password" id="password" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a3a; color: white; box-sizing: border-box;">
        <button onclick="login()" style="width: 100%; padding: 12px; background: #00d2ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase;">Login</button>
    </div>
</div>

<div id="mainPanel" style="display: none; width: 90%; max-width: 500px;">
    <button class="logout-btn" onclick="logout()">Logout</button>
    <div class="panel">
        <h2>LIVE PANEL</h2>
        <div class="timer-container">
            <span id="statusText">Status: Ready to Stream</span>
            <div id="timer">00:00:00</div>
        </div>
        <div id="progressContainer" class="progress-container">
            <div class="progress-bar-bg"><div id="progressFill" class="progress-bar-fill"></div></div>
            <span id="progressPercent">Uploading... 0% (0 MB)</span>
        </div>
        <div class="input-group">
            <label>Stream Name</label>
            <input type="text" id="streamName" placeholder="Nayem Live">
        </div>
        <div class="input-group">
            <label>Source Type</label>
            <select id="sourceType" onchange="toggleSource()">
                <option value="link">🔗 Video/YouTube Link</option>
                <option value="file">📁 Upload Video File</option>
            </select>
        </div>
        <div id="linkInput" class="input-group">
            <label>Video URL:</label>
            <input type="text" id="videoSource" placeholder="https://youtube.com/...">
        </div>
        <div id="fileInput" class="input-group hidden">
            <label>Select Video File (Up to 1GB):</label>
            <input type="file" id="videoFile" accept="video/*">
        </div>
        <div class="input-group">
            <label>Live Mode (View Style)</label>
            <select id="liveMode">
                <option value="standard">📺 Standard (Horizontal 16:9)</option>
                <option value="shorts">📱 Shorts (Vertical 9:16)</option>
            </select>
        </div>
        <div class="input-group">
            <label>Stream Duration</label>
            <select id="duration">
                <option value="0">🔄 24/7 Loop (Unlimited)</option>
                <option value="120">⏱️ 2 Hours</option>
                <option value="180">⏱️ 3 Hours</option>
                <option value="300">⏱️ 5 Hours</option>
                <option value="1440">⏱️ 24 Hours</option>
            </select>
        </div>
        <div class="loop-container">
            <input type="checkbox" id="loopStream" checked>
            <label for="loopStream">🔄 Loop Video (Active)</label>
        </div>
        <div class="input-group">
            <label>Target Platform</label>
            <select id="platform">
                <option value="rtmp://a.rtmp.youtube.com/live2">🔴 YouTube</option>
                <option value="rtmps://live-api-s.facebook.com:443/rtmp/">🔵 Facebook</option>
            </select>
        </div>
        <div class="input-group">
            <label>Stream Key</label>
            <input type="text" id="streamKey" placeholder="Enter stream key">
        </div>
        <div id="buttonArea">
            <button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>
        </div>
    </div>
</div>

<script>
    let timerInterval;
    let startTime;
    let sessionToken = localStorage.getItem('live_token');

    window.onload = async () => {
        if (sessionToken) showPanel();
        try {
            const response = await fetch('/status');
            const data = await response.json();
            if (data.isActive && data.startTime) {
                startTime = data.startTime;
                document.getElementById('statusText').innerText = "Status: Live Stream Started!";
                document.getElementById('buttonArea').innerHTML = `<button id="stopBtn" class="stop-btn" onclick="stopStream()">Stop Live Stream</button>`;
                startSyncTimer();
            }
        } catch (e) {}
    };

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, pass })
        });
        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('live_token', data.token);
            sessionToken = data.token;
            showPanel();
        } else { alert("ভুল ইউজারনেম বা পাসওয়ার্ড!"); }
    }

    function showPanel() {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'flex';
    }

    function logout() { localStorage.removeItem('live_token'); location.reload(); }

    function toggleSource() {
        const type = document.getElementById('sourceType').value;
        document.getElementById('linkInput').classList.toggle('hidden', type === 'file');
        document.getElementById('fileInput').classList.toggle('hidden', type === 'link');
    }

    function startSyncTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const now = Date.now();
            const diff = Math.floor((now - startTime) / 1000);
            let h = Math.floor(diff / 3600);
            let m = Math.floor((diff % 3600) / 60);
            let s = diff % 60;
            document.getElementById('timer').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);
    }

    async function startStream() {
        const btn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const progContainer = document.getElementById('progressContainer');
        const progFill = document.getElementById('progressFill');
        const progPercent = document.getElementById('progressPercent');
        const btnArea = document.getElementById('buttonArea');
        
        const type = document.getElementById('sourceType').value;
        const key = document.getElementById('streamKey').value;
        const platform = document.getElementById('platform').value;
        const loop = document.getElementById('loopStream').checked;
        const mode = document.getElementById('liveMode').value;
        const duration = document.getElementById('duration').value;

        if (!key) { alert("স্ট্রিম কি বসান!"); return; }

        const formData = new FormData();
        formData.append('type', type);
        formData.append('platform', platform);
        formData.append('key', key);
        formData.append('loop', loop);
        formData.append('mode', mode);
        formData.append('duration', duration);
        formData.append('token', sessionToken);

        if (type === 'link') {
            formData.append('source', document.getElementById('videoSource').value);
        } else {
            const file = document.getElementById('videoFile').files[0];
            if (!file) { alert("ভিডিও ফাইল সিলেক্ট করুন!"); return; }
            formData.append('videoFile', file);
        }

        btn.innerText = "CONNECTING...";
        btn.disabled = true;
        statusText.innerText = "Status: Processing...";

        const xhr = new XMLHttpRequest();
        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const p = Math.round((e.loaded / e.total) * 100);
                const mbLoaded = (e.loaded / (1024 * 1024)).toFixed(2);
                const mbTotal = (e.total / (1024 * 1024)).toFixed(2);
                progContainer.style.display = 'block';
                progFill.style.width = p + '%';
                progPercent.innerText = `Uploading... ${p}% (${mbLoaded} MB / ${mbTotal} MB)`;
                statusText.innerText = `Status: Uploading ${p}%`;
            }
        };

        xhr.onload = () => {
            if (xhr.status === 200) {
                alert("লাইভ শুরু হয়েছে!");
                statusText.innerText = "Status: Live Stream Started!";
                fetch('/status').then(res => res.json()).then(data => {
                    startTime = data.startTime;
                    startSyncTimer();
                });
                btnArea.innerHTML = `<button id="stopBtn" class="stop-btn" onclick="stopStream()">Stop Live Stream</button>`;
            } else {
                alert("সার্ভার এরর! সম্ভবত ফাইলটি খুব বড়।");
                statusText.innerText = "Status: Error Occurred";
                btn.innerText = "Start Live Stream";
                btn.disabled = false;
            }
            setTimeout(() => { progContainer.style.display = 'none'; }, 3000);
        };

        xhr.open('POST', '/start-stream', true);
        xhr.send(formData);
    }

    async function stopStream() {
        const statusText = document.getElementById('statusText');
        const btnArea = document.getElementById('buttonArea');
        if(!confirm("বন্ধ করতে চান?")) return;
        try {
            const response = await fetch('/stop-stream', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: sessionToken })
            });
            if(response.ok) {
                alert("বন্ধ হয়েছে!");
                statusText.innerText = "Status: Ready to Stream";
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = "00:00:00";
                btnArea.innerHTML = `<button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>`;
            }
        } catch (e) { alert("Error!"); }
    }
</script>
</body>
</html>
