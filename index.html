<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Multi-Mode Live Panel</title>
    <style>
        body { background-color: #050510; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .panel { background-color: #111125; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 100%; max-width: 500px; border: 1px solid #1a1a3a; }
        h2 { text-align: center; color: #00d2ff; font-size: 24px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .timer-container { text-align: center; margin-bottom: 20px; padding: 15px; border: 2px dashed #00d2ff; border-radius: 15px; background: rgba(0, 210, 255, 0.05); }
        #statusText { color: #aaa; font-size: 14px; margin-bottom: 5px; display: block; }
        #timer { color: #00d2ff; font-size: 32px; font-weight: bold; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 10px #00d2ff; }
        .progress-container { display: none; margin-bottom: 20px; text-align: center; }
        .progress-bar-bg { background: #1a1a3a; border-radius: 10px; height: 12px; width: 100%; border: 1px solid #2a2a4a; overflow: hidden; }
        .progress-bar-fill { background: linear-gradient(90deg, #00d2ff, #00a2ff); height: 100%; width: 0%; transition: width 0.2s; }
        #progressPercent { font-size: 13px; color: #00d2ff; margin-top: 5px; display: block; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a3a; color: white; font-size: 14px; box-sizing: border-box; outline: none; }
        .hidden { display: none; }
        .loop-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; background: rgba(0, 210, 255, 0.1); padding: 10px; border-radius: 8px; cursor: pointer; }
        .loop-container input { width: auto; cursor: pointer; }
        .loop-container label { margin-bottom: 0; cursor: pointer; color: #00d2ff; font-weight: bold; }
        .start-btn { width: 100%; padding: 15px; background-color: #00d2ff; border: none; border-radius: 8px; color: #050510; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; margin-top: 20px; transition: 0.3s; }
        .stop-btn { width: 100%; padding: 15px; background-color: #ff4b2b; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; margin-top: 20px; transition: 0.3s; }
        .start-btn:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="panel">
    <h2>LIVE PANEL</h2>
    <div class="timer-container">
        <span id="statusText">Status: Ready to Stream</span>
        <div id="timer">00:00:00</div>
    </div>
    <div id="progressContainer" class="progress-container">
        <div class="progress-bar-bg">
            <div id="progressFill" class="progress-bar-fill"></div>
        </div>
        <span id="progressPercent">Uploading... 0%</span>
    </div>
    <div class="input-group">
        <label>Stream Name</label>
        <input type="text" id="streamName" placeholder="Nayem Live">
    </div>
    <div class="input-group">
        <label>Source Type</label>
        <select id="sourceType" onchange="toggleSource()">
            <option value="link">🔗 Video/YouTube Link</option>
            <option value="file">📁 Upload Video File</option>
        </select>
    </div>
    <div id="linkInput" class="input-group">
        <label>Video URL:</label>
        <input type="text" id="videoSource" placeholder="https://youtube.com/...">
    </div>
    <div id="fileInput" class="input-group hidden">
        <label>Select Video File:</label>
        <input type="file" id="videoFile" accept="video/*">
    </div>

    <!-- 🌟 লাইভ মোড সিলেক্টর -->
    <div class="input-group">
        <label>Live Mode (View Style)</label>
        <select id="liveMode">
            <option value="standard">📺 Standard (Horizontal 16:9)</option>
            <option value="shorts">📱 Shorts (Vertical 9:16)</option>
        </select>
    </div>

    <div class="loop-container">
        <input type="checkbox" id="loopStream">
        <label for="loopStream">🔄 Loop Video (24/7 Live)</label>
    </div>
    <div class="input-group">
        <label>Target Platform</label>
        <select id="platform">
            <option value="rtmp://a.rtmp.youtube.com/live2">🔴 YouTube</option>
            <option value="rtmps://live-api-s.facebook.com:443/rtmp/">🔵 Facebook</option>
        </select>
    </div>
    <div class="input-group">
        <label>Stream Key</label>
        <input type="text" id="streamKey" placeholder="Enter stream key">
    </div>
    <div id="buttonArea">
        <button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>
    </div>
</div>

<script>
    let timerInterval;
    let seconds = 0;

    function toggleSource() {
        const type = document.getElementById('sourceType').value;
        document.getElementById('linkInput').classList.toggle('hidden', type === 'file');
        document.getElementById('fileInput').classList.toggle('hidden', type === 'link');
    }

    function startTimer() {
        clearInterval(timerInterval);
        seconds = 0;
        timerInterval = setInterval(() => {
            seconds++;
            let h = Math.floor(seconds / 3600);
            let m = Math.floor((seconds % 3600) / 60);
            let s = seconds % 60;
            document.getElementById('timer').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);
    }

    async function startStream() {
        const btn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const progContainer = document.getElementById('progressContainer');
        const progFill = document.getElementById('progressFill');
        const progPercent = document.getElementById('progressPercent');
        const btnArea = document.getElementById('buttonArea');
        
        const type = document.getElementById('sourceType').value;
        const key = document.getElementById('streamKey').value;
        const platform = document.getElementById('platform').value;
        const loop = document.getElementById('loopStream').checked;
        const mode = document.getElementById('liveMode').value; // মোড ডাটা নেওয়া হচ্ছে

        if (!key) { alert("স্ট্রিম কি বসান!"); return; }

        const formData = new FormData();
        formData.append('type', type);
        formData.append('platform', platform);
        formData.append('key', key);
        formData.append('loop', loop);
        formData.append('mode', mode); // মোড সার্ভারে পাঠানো হচ্ছে

        if (type === 'link') {
            formData.append('source', document.getElementById('videoSource').value);
        } else {
            const file = document.getElementById('videoFile').files[0];
            if (!file) { alert("ভিডিও ফাইল সিলেক্ট করুন!"); return; }
            formData.append('videoFile', file);
        }

        btn.innerText = "CONNECTING...";
        btn.disabled = true;
        statusText.innerText = "Status: Processing...";

        const xhr = new XMLHttpRequest();
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percentComplete = Math.round((e.loaded / e.total) * 100);
                progContainer.style.display = 'block';
                progFill.style.width = percentComplete + '%';
                progPercent.innerText = `Uploading... ${percentComplete}%`;
                statusText.innerText = `Status: Uploading ${percentComplete}%`;
            }
        };

        xhr.onload = function() {
            if (xhr.status === 200) {
                alert("লাইভ শুরু হয়েছে!");
                statusText.innerText = "Status: Live Stream Started!";
                startTimer();
                btnArea.innerHTML = `<button id="stopBtn" class="stop-btn" onclick="stopStream()">Stop Live Stream</button>`;
            } else {
                alert("সার্ভার এরর!");
                statusText.innerText = "Status: Error Occurred";
                btn.innerText = "Start Live Stream";
                btn.disabled = false;
            }
            setTimeout(() => { progContainer.style.display = 'none'; }, 3000);
        };

        xhr.open('POST', '/start-stream', true);
        xhr.send(formData);
    }

    async function stopStream() {
        const statusText = document.getElementById('statusText');
        const btnArea = document.getElementById('buttonArea');
        if(!confirm("আপনি কি নিশ্চিত যে লাইভটি বন্ধ করতে চান?")) return;

        try {
            const response = await fetch('/stop-stream', { method: 'POST' });
            const result = await response.text();
            alert(result);
            statusText.innerText = "Status: Ready to Stream";
            clearInterval(timerInterval);
            document.getElementById('timer').innerText = "00:00:00";
            btnArea.innerHTML = `<button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>`;
        } catch (error) {
            alert("বন্ধ করতে সমস্যা হয়েছে!");
        }
    }
</script>
</body>
</html>
