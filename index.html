<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Multi-Stream Panel</title>
    <style>
        body { background-color: #050510; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        
        #loginPage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050510; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: #111125; padding: 40px; border-radius: 20px; border: 1px solid #1a1a3a; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .login-box h2 { color: #00d2ff; margin-bottom: 20px; text-transform: uppercase; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a3a; color: white; box-sizing: border-box; outline: none; }
        .login-box button { width: 100%; padding: 12px; background: #00d2ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        #mainPanel { display: none; width: 95%; max-width: 500px; padding: 20px 0; }
        .logout-btn { position: absolute; top: 20px; right: 20px; background: none; border: 1px solid #ff4b2b; color: #ff4b2b; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; z-index: 10; }
        
        .master-source { background: #111125; padding: 20px; border-radius: 20px; border: 2px solid #00d2ff; margin-bottom: 25px; text-align: center; box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
        .master-source h3 { color: #00d2ff; margin-bottom: 15px; font-size: 18px; }
        
        .channel-card { background: #111125; padding: 20px; border-radius: 20px; border: 1px solid #1a1a3a; margin-bottom: 20px; position: relative; transition: 0.3s; }
        .channel-title { color: #00d2ff; font-size: 18px; font-weight: bold; margin-bottom: 15px; display: block; }
        
        .status-box { text-align: center; margin-bottom: 15px; padding: 10px; border: 2px dashed #00d2ff; border-radius: 12px; background: rgba(0, 210, 255, 0.05); }
        .status-text { color: #aaa; font-size: 13px; display: block; }
        .timer { color: #00d2ff; font-size: 28px; font-weight: bold; font-family: monospace; text-shadow: 0 0 8px #00d2ff; }
        
        .input-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #aaa; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a3a; color: white; font-size: 13px; box-sizing: border-box; outline: none; }
        
        .loop-group { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 13px; color: #00d2ff; cursor: pointer; }
        .loop-group input { width: auto; }
        
        .start-btn { width: 100%; padding: 12px; background: #00d2ff; border: none; border-radius: 8px; color: #050510; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .stop-btn { width: 100%; padding: 12px; background: #ff4b2b; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        .hidden { display: none; }
        .progress-container { display: none; margin: 10px 0; text-align: center; }
        .progress-bar-bg { background: #1a1a3a; border-radius: 10px; height: 10px; width: 100%; border: 1px solid #2a2a4a; overflow: hidden; }
        .progress-bar-fill { background: #00d2ff; height: 100%; width: 0%; transition: width 0.2s; }
        #progressPercent { font-size: 12px; color: #00d2ff; margin-top: 5px; display: block; }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-box">
        <h2>User Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<div id="mainPanel">
    <button class="logout-btn" onclick="logout()">Logout</button>
    
    <div class="master-source">
        <h3>📁 Master Video Source</h2>
        <input type="file" id="masterFile" accept="video/*">
        <button class="start-btn" style="margin-top:10px" onclick="uploadMaster()">Upload Master Video</button>
        <div id="progressContainer" class="progress-container">
            <div class="progress-bar-bg"><div id="progressFill" class="progress-bar-fill"></div></div>
            <span id="progressPercent">Uploading... 0%</span>
        </div>
        <div id="uploadStatus" style="margin-top:10px; font-size:13px; color:#00d2ff">No video uploaded yet</div>
    </div>

    <!-- Channel 1 -->
    <div class="channel-card" id="card-1">
        <span class="channel-title">Channel 1</span>
        <div class="status-box">
            <span class="status-text" id="st-1">Status: Ready</span>
            <div class="timer" id="tm-1">00:00:00</div>
        </div>
        <div class="settings-1">
            <div class="input-row">
                <div class="input-group"><label>Stream Key</label><input type="text" id="key-1" placeholder="Enter Key"></div>
                <div class="input-group"><label>Duration (Mins)</label><input type="number" id="dur-1" value="0"></div>
            </div>
            <div class="loop-group"><input type="checkbox" id="loop-1"><label for="loop-1">🔄 Loop Video (24/7 Live)</label></div>
            <button class="start-btn" id="btn-1" onclick="startStream(1)">Start Live</button>
        </div>
        <button class="stop-btn hidden" id="stop-1" onclick="stopStream(1)">Stop Live</button>
    </div>

    <!-- Channel 2 -->
    <div class="channel-card" id="card-2">
        <span class="channel-title">Channel 2</span>
        <div class="status-box">
            <span class="status-text" id="st-2">Status: Ready</span>
            <div class="timer" id="tm-2">00:00:00</div>
        </div>
        <div class="settings-2">
            <div class="input-row">
                <div class="input-group"><label>Stream Key</label><input type="text" id="key-2" placeholder="Enter Key"></div>
                <div class="input-group"><label>Duration (Mins)</label><input type="number" id="dur-2" value="0"></div>
            </div>
            <div class="loop-group"><input type="checkbox" id="loop-2"><label for="loop-2">🔄 Loop Video (24/7 Live)</label></div>
            <button class="start-btn" id="btn-2" onclick="startStream(2)">Start Live</button>
        </div>
        <button class="stop-btn hidden" id="stop-2" onclick="stopStream(2)">Stop Live</button>
    </div>

    <!-- Channel 3 -->
    <div class="channel-card" id="card-3">
        <span class="channel-title">Channel 3</span>
        <div class="status-box">
            <span class="status-text" id="st-3">Status: Ready</span>
            <div class="timer" id="tm-3">00:00:00</div>
        </div>
        <div class="settings-3">
            <div class="input-row">
                <div class="input-group"><label>Stream Key</label><input type="text" id="key-3" placeholder="Enter Key"></div>
                <div class="input-group"><label>Duration (Mins)</label><input type="number" id="dur-3" value="0"></div>
            </div>
            <div class="loop-group"><input type="checkbox" id="loop-3"><label for="loop-3">🔄 Loop Video (24/7 Live)</label></div>
            <button class="start-btn" id="btn-3" onclick="startStream(3)">Start Live</button>
        </div>
        <button class="stop-btn hidden" id="stop-3" onclick="stopStream(3)">Stop Live</button>
    </div>
</div>

<script>
    let sessionToken = localStorage.getItem('live_token');
    let timers = {};

    window.onload = async () => {
        if (sessionToken) showPanel();
        updateStatus();
        setInterval(updateStatus, 5000);
    };

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, pass })
        });
        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('live_token', data.token);
            sessionToken = data.token;
            showPanel();
        } else { alert("ভুল ইউজারনেম বা পাসওয়ার্ড!"); }
    }

    function showPanel() {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';
    }

    function logout() { localStorage.removeItem('live_token'); location.reload(); }

    async function uploadMaster() {
        const file = document.getElementById('masterFile').files[0];
        if (!file) { alert("ভিডিও ফাইল সিলেক্ট করুন!"); return; }

        const formData = new FormData();
        formData.append('videoFile', file);
        formData.append('token', sessionToken);

        const progContainer = document.getElementById('progressContainer');
        const progFill = document.getElementById('progressFill');
        const progPercent = document.getElementById('progressPercent');
        
        const xhr = new XMLHttpRequest();
        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const p = Math.round((e.loaded / e.total) * 100);
                progContainer.style.display = 'block';
                progFill.style.width = p + '%';
                progPercent.innerText = `Uploading... ${p}%`;
            }
        };

        xhr.onload = () => {
            if (xhr.status === 200) {
                document.getElementById('uploadStatus').innerText = "✅ Master Video Ready!";
                alert("ভিডিও সফলভাবে আপলোড হয়েছে!");
            } else { alert("আপলোড ফেইল হয়েছে!"); }
            progContainer.style.display = 'none';
        };

        xhr.open('POST', '/upload-master', true);
        xhr.send(formData);
    }

    async function startStream(id) {
        const key = document.getElementById(`key-${id}`).value;
        const dur = document.getElementById(`dur-${id}`).value;
        const loop = document.getElementById(`loop-${id}`).checked;

        if (!key) { alert("স্ট্রিম কি বসান!"); return; }

        const formData = new FormData();
        formData.append('channelId', id);
        formData.append('key', key);
        formData.append('duration', dur);
        formData.append('loop', loop);
        formData.append('token', sessionToken);
        formData.append('platform', 'rtmp://a.rtmp.youtube.com/live2');

        const res = await fetch('/start-stream', { method: 'POST', body: formData });
        if (res.ok) {
            alert(`Channel ${id} Live Started!`);
            toggleUI(id, true);
        } else { alert("লাইভ শুরু হয়নি!"); }
    }

    async function stopStream(id) {
        const res = await fetch('/stop-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ channelId: id, token: sessionToken })
        });
        if (res.ok) {
            alert(`Channel ${id} Stopped!`);
            toggleUI(id, false);
        }
    }

    function toggleUI(id, isLive) {
        document.getElementById(`btn-${id}`).classList.toggle('hidden', isLive);
        document.getElementById(`stop-${id}`).classList.toggle('hidden', !isLive);
        const settings = document.querySelector(`.settings-${id}`);
        if(settings) settings.classList.toggle('hidden', isLive);
    }

    async function updateStatus() {
        try {
            const res = await fetch('/status');
            const data = await res.json();
            for (let id in data.streams) {
                const s = data.streams[id];
                document.getElementById(`st-${id}`).innerText = s.isActive ? "Status: Live" : "Status: Ready";
                if (s.isActive && s.startTime) {
                    startSyncTimer(id, s.startTime);
                    toggleUI(id, true);
                } else {
                    clearInterval(timers[id]);
                    document.getElementById(`tm-${id}`).innerText = "00:00:00";
                    toggleUI(id, false);
                }
            }
        } catch (e) {}
    }

    function startSyncTimer(id, start) {
        if (timers[id]) clearInterval(timers[id]);
        timers[id] = setInterval(() => {
            const diff = Math.floor((Date.now() - start) / 1000);
            let h = Math.floor(diff / 3600);
            let m = Math.floor((diff % 3600) / 60);
            let s = diff % 60;
            document.getElementById(`tm-${id}`).innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);
    }
</script>
</body>
</html>
