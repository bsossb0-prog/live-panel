<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Stream Panel</title>
    <style>
        body { background-color: #050510; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .panel { background-color: #111125; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 400px; border: 1px solid #1a1a3a; }
        h2 { text-align: center; color: #00d2ff; text-transform: uppercase; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a3a; color: white; box-sizing: border-box; }
        
        /* Status Section */
        .status-box { background: #0a0a1a; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; border: 1px dashed #333; }
        .status-dot { height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background-color: #00ff00; box-shadow: 0 0 10px #00ff00; }
        #status-text { font-weight: bold; font-size: 14px; }
        #timer { font-family: monospace; color: #00d2ff; font-size: 18px; margin-top: 5px; display: block; }

        .start-btn { width: 100%; padding: 15px; background-color: #00d2ff; border: none; border-radius: 8px; color: #050510; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; transition: 0.3s; }
        .start-btn:disabled { background-color: #444; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="panel">
    <h2>LIVE PANEL</h2>
    
    <div class="status-box">
        <span id="dot" class="status-dot"></span>
        <span id="status-text">Status: Offline</span>
        <span id="timer">00:00:00</span>
    </div>

    <div class="input-group">
        <label>Stream Name</label>
        <input type="text" id="streamName" placeholder="My Live Stream">
    </div>

    <div class="input-group">
        <label>Source Type</label>
        <select id="sourceType">
            <option value="link">🔗 Video/YouTube Link</option>
            <option value="file">📁 Local Video File</option>
        </select>
    </div>

    <div class="input-group">
        <label>Video Source:</label>
        <input type="text" id="videoSource" placeholder="https://youtube.com/watch?v=...">
    </div>

    <div class="input-group">
        <label>Target Platform</label>
        <select id="platform">
            <option value="rtmp://a.rtmp.youtube.com/live2">🔴 YouTube</option>
            <option value="rtmps://live-api-s.facebook.com:443/rtmp/">🔵 Facebook</option>
        </select>
    </div>

    <div class="input-group">
        <label>Stream Key</label>
        <input type="text" id="streamKey" placeholder="Enter stream key here">
    </div>

    <button id="btn" class="start-btn" onclick="startStream()">Start Live Stream</button>
</div>

<script>
    let startTime;
    let timerInterval;

    async function startStream() {
        const btn = document.getElementById('btn');
        btn.disabled = true;
        btn.innerText = "Processing...";

        const data = {
            type: document.getElementById('sourceType').value,
            source: document.getElementById('videoSource').value,
            platform: document.getElementById('platform').value,
            key: document.getElementById('streamKey').value
        };

        const response = await fetch('/start-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.text();
        alert(result);
        
        btn.innerText = "Stream Running...";
        startTime = Date.now();
        startTimer();
        checkStatus();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            const elapsed = Date.now() - startTime;
            const h = Math.floor(elapsed / 3600000).toString().padStart(2, '0');
            const m = Math.floor((elapsed % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
        }, 1000);
    }

    async function checkStatus() {
        setInterval(async () => {
            const response = await fetch('/status');
            const data = await response.json();
            const dot = document.getElementById('dot');
            const text = document.getElementById('status-text');

            if (data.status === 'online') {
                dot.className = 'status-dot online';
                text.innerText = 'Status: 🔴 LIVE';
            } else {
                dot.className = 'status-dot';
                text.innerText = 'Status: ⚪ Offline';
                document.getElementById('btn').disabled = false;
                document.getElementById('btn').innerText = "Start Live Stream";
                clearInterval(timerInterval);
            }
        }, 5000);
    }
</script>

</body>
</html>
