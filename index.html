<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Panel</title>
    <style>
        body { background-color: #050510; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        #loginPage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050510; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: #111125; padding: 40px; border-radius: 20px; border: 1px solid #1a1a3a; width: 300px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .login-box h2 { color: #00d2ff; margin-bottom: 20px; text-transform: uppercase; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a3a; color: white; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 12px; background: #00d2ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        #mainPanel { display: none; width: 90%; max-width: 450px; }
        .panel { background-color: #111125; padding: 25px; border-radius: 20px; border: 1px solid #1a1a3a; margin-bottom: 20px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { text-align: center; color: #00d2ff; font-size: 22px; margin-bottom: 20px; text-transform: uppercase; }
        .timer-container { text-align: center; margin-bottom: 20px; padding: 10px; border: 2px dashed #00d2ff; border-radius: 15px; background: rgba(0, 210, 255, 0.05); }
        #statusText { color: #aaa; font-size: 14px; display: block; }
        #timer { color: #00d2ff; font-size: 30px; font-weight: bold; font-family: monospace; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #aaa; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a3a; color: white; font-size: 14px; box-sizing: border-box; }
        .start-btn { width: 100%; padding: 15px; background-color: #00d2ff; border: none; border-radius: 8px; color: #050510; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .stop-btn { width: 100%; padding: 15px; background-color: #ff4b2b; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .logout-btn { position: absolute; top: 10px; right: 10px; background: none; border: 1px solid #ff4b2b; color: #ff4b2b; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-box">
        <h2>User Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<div id="mainPanel">
    <button class="logout-btn" onclick="logout()">Logout</button>
    <div class="panel">
        <h2>LIVE PANEL</h2>
        <div class="timer-container">
            <span id="statusText">Status: Ready to Stream</span>
            <div id="timer">00:00:00</div>
        </div>
        <div class="input-group">
            <label>Video Source (Link or Path)</label>
            <input type="text" id="videoSource" placeholder="https://youtube.com/...">
        </div>
        <div class="input-group">
            <label>Stream Key</label>
            <input type="text" id="streamKey" placeholder="Enter stream key">
        </div>
        <div class="input-group">
            <label><input type="checkbox" id="loopStream"> 🔄 Loop Video (24/7)</label>
        </div>
        <div id="buttonArea">
            <button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>
        </div>
    </div>
</div>

<script>
    let sessionToken = localStorage.getItem('live_token');
    let timerInterval;
    let startTime;

    window.onload = async () => {
        if (sessionToken) showPanel();
        checkStatus();
    };

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const res = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user, pass })
        });
        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('live_token', data.token);
            sessionToken = data.token;
            showPanel();
        } else alert("ভুল ইউজারনেম বা পাসওয়ার্ড!");
    }

    function showPanel() {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'block';
    }

    function logout() { localStorage.removeItem('live_token'); location.reload(); }

    async function checkStatus() {
        try {
            const res = await fetch('/status');
            const data = await res.json();
            if (data.isActive) {
                startTime = data.startTime;
                document.getElementById('statusText').innerText = "Status: LIVE";
                document.getElementById('buttonArea').innerHTML = `<button class="stop-btn" onclick="stopStream()">Stop Live Stream</button>`;
                startTimer();
            }
        } catch (e) {}
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const diff = Math.floor((Date.now() - startTime) / 1000);
            let h = Math.floor(diff / 3600);
            let m = Math.floor((diff % 3600) / 60);
            let s = diff % 60;
            document.getElementById('timer').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);
    }

    async function startStream() {
        const source = document.getElementById('videoSource').value;
        const key = document.getElementById('streamKey').value;
        const loop = document.getElementById('loopStream').checked;

        if (!key || !source) { alert("সোর্স এবং কি বসান!"); return; }

        const res = await fetch('/start-stream', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ source, key, platform: 'rtmp://a.rtmp.youtube.com/live2', loop, token: sessionToken })
        });

        if (res.ok) {
            alert("লাইভ শুরু হয়েছে!");
            checkStatus();
        } else {
            alert("Error: " + await res.text());
        }
    }

    async function stopStream() {
        await fetch('/stop-stream', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ token: sessionToken })
        });
        alert("লাইভ বন্ধ হয়েছে!");
        location.reload();
    }
</script>
</body>
</html>
