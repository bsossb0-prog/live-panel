<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Stream Panel</title>
    <style>
        body { background-color: #050510; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .panel { background-color: #111125; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 90%; max-width: 400px; border: 1px solid #1a1a3a; }
        h2 { text-align: center; color: #00d2ff; font-size: 22px; margin-bottom: 25px; text-transform: uppercase; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a3a; color: white; font-size: 14px; box-sizing: border-box; outline: none; }
        .hidden { display: none; }
        .start-btn { width: 100%; padding: 15px; background-color: #00d2ff; border: none; border-radius: 8px; color: #050510; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; margin-top: 20px; transition: 0.3s; }
        .start-btn:disabled { background-color: #555; cursor: not-allowed; }
        .status-box { text-align: center; margin-bottom: 20px; padding: 10px; border: 1px dashed #00d2ff; border-radius: 10px; color: #00d2ff; font-weight: bold; }
    </style>
</head>
<body>

<div class="panel">
    <h2>LIVE PANEL</h2>
    <div id="status" class="status-box">Status: Ready to Stream</div>
    
    <div class="input-group">
        <label>Stream Name</label>
        <input type="text" id="streamName" placeholder="Nayem Live">
    </div>

    <div class="input-group">
        <label>Source Type</label>
        <select id="sourceType" onchange="toggleSource()">
            <option value="link">🔗 Video/YouTube Link</option>
            <option value="file">📁 Upload Video File</option>
        </select>
    </div>

    <div id="linkInput" class="input-group">
        <label>Video URL:</label>
        <input type="text" id="videoSource" placeholder="https://youtube.com/...">
    </div>

    <div id="fileInput" class="input-group hidden">
        <label>Select Video File:</label>
        <input type="file" id="videoFile" accept="video/*">
    </div>

    <div class="input-group">
        <label>Target Platform</label>
        <select id="platform">
            <option value="rtmp://a.rtmp.youtube.com/live2">🔴 YouTube</option>
            <option value="rtmps://live-api-s.facebook.com:443/rtmp/">🔵 Facebook</option>
        </select>
    </div>

    <div class="input-group">
        <label>Stream Key</label>
        <input type="text" id="streamKey" placeholder="Enter stream key">
    </div>

    <button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>
</div>

<script>
    function toggleSource() {
        const type = document.getElementById('sourceType').value;
        document.getElementById('linkInput').classList.toggle('hidden', type === 'file');
        document.getElementById('fileInput').classList.toggle('hidden', type === 'link');
    }

    async function startStream() {
        const btn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const type = document.getElementById('sourceType').value;
        const key = document.getElementById('streamKey').value;
        const platform = document.getElementById('platform').value;

        if (!key) { alert("স্ট্রিম কি বসান!"); return; }

        const formData = new FormData();
        formData.append('type', type);
        formData.append('platform', platform);
        formData.append('key', key);

        if (type === 'link') {
            formData.append('source', document.getElementById('videoSource').value);
        } else {
            const file = document.getElementById('videoFile').files[0];
            if (!file) { alert("ভিডিও ফাইল সিলেক্ট করুন!"); return; }
            formData.append('videoFile', file);
        }

        btn.innerText = "STREAMING...";
        btn.disabled = true;
        status.innerText = "Status: Processing... Please wait";

        try {
            const response = await fetch('/start-stream', {
                method: 'POST',
                body: formData // JSON এর বদলে FormData ব্যবহার করছি আপলোডের জন্য
            });
            const result = await response.text();
            alert(result);
            status.innerText = "Status: Live Stream Started!";
        } catch (error) {
            alert("সার্ভার এরর! দয়া করে লগ চেক করুন।");
            status.innerText = "Status: Error Occurred";
        } finally {
            btn.innerText = "Start Live Stream";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
