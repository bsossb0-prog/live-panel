<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Live Panel</title>
    <style>
        :root{
            --bg:#050713;
            --card:#11162b;
            --card2:#171d38;
            --text:#f8fbff;
            --muted:#9aa7bd;
            --cyan:#00e5ff;
            --blue:#2f7bff;
            --purple:#8b5cf6;
            --pink:#ff3dbe;
            --red:#ff3b5f;
            --green:#24f7a3;
            --border:rgba(255,255,255,.12);
            --shadow:0 28px 80px rgba(0,0,0,.55);
        }
        *{box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{
            margin:0;
            min-height:100vh;
            color:var(--text);
            font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 10%, rgba(0,229,255,.22), transparent 28%),
                radial-gradient(circle at 85% 5%, rgba(139,92,246,.25), transparent 28%),
                radial-gradient(circle at 50% 100%, rgba(255,61,190,.12), transparent 35%),
                linear-gradient(135deg,#03040b 0%,#090c1c 50%,#050713 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:18px;
            overflow-x:hidden;
        }
        body::before{
            content:"";
            position:fixed;
            inset:0;
            pointer-events:none;
            background-image:
                linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
            background-size:42px 42px;
            mask-image:linear-gradient(to bottom, rgba(0,0,0,.8), transparent 82%);
        }
        #loginPage{
            position:fixed;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:1000;
            padding:22px;
            background:rgba(3,4,12,.85);
            backdrop-filter:blur(22px);
        }
        .login-box{
            width:min(390px,100%);
            position:relative;
            padding:34px 28px 28px;
            border-radius:28px;
            border:1px solid var(--border);
            background:linear-gradient(160deg, rgba(22,28,54,.82), rgba(9,12,28,.92));
            box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.12);
            text-align:center;
        }
        .login-box h2,.panel h2{
            margin:0;
            text-align:center;
            font-size:clamp(24px,6vw,36px);
            line-height:1.1;
            text-transform:uppercase;
            letter-spacing:4px;
            color:transparent;
            background:linear-gradient(90deg,#fff 0%,var(--cyan) 35%,var(--purple) 70%,#fff 100%);
            background-size:220% auto;
            -webkit-background-clip:text;
            background-clip:text;
            animation:shineText 5s linear infinite;
        }
        @keyframes shineText{to{background-position:220% center}}
        .subtitle{
            margin:10px 0 22px;
            color:var(--muted);
            font-size:13px;
        }
        .login-box input,.input-group input,.input-group select{
            width:100%;
            min-height:54px;
            padding:14px 16px;
            border-radius:16px;
            border:1px solid rgba(255,255,255,.13);
            background:rgba(255,255,255,.07);
            color:#fff;
            outline:none;
            font-size:15px;
            box-sizing:border-box;
            transition:.22s ease;
        }
        .login-box input{margin-bottom:13px}
        .login-box input:focus,.input-group input:focus,.input-group select:focus{
            border-color:rgba(0,229,255,.75);
            box-shadow:0 0 0 4px rgba(0,229,255,.12);
            background:rgba(255,255,255,.1);
        }
        .login-box button,.start-btn,.stop-btn{
            width:100%;
            min-height:56px;
            border:0;
            border-radius:18px;
            font-weight:900;
            cursor:pointer;
            text-transform:uppercase;
            transition:transform .2s ease;
        }
        .login-box button,.start-btn{
            color:#03101a;
            background:linear-gradient(135deg,var(--cyan),#48ffdf 45%,var(--purple));
            box-shadow:0 16px 38px rgba(0,229,255,.22);
        }
        .stop-btn{
            color:#fff;
            background:linear-gradient(135deg,#ff3b5f,#ff7b2f);
            box-shadow:0 16px 38px rgba(255,59,95,.22);
        }
        #mainPanel{
            display:none;
            width:100%;
            max-width:560px;
            position:relative;
        }
        .panel{
            padding:26px;
            border-radius:32px;
            border:1px solid var(--border);
            background:linear-gradient(160deg, rgba(17,22,43,.88), rgba(8,11,27,.95));
            box-shadow:var(--shadow);
        }
        .logout-btn{
            position:absolute;
            top:18px;
            right:18px;
            z-index:3;
            padding:9px 12px;
            border-radius:999px;
            border:1px solid rgba(255,59,95,.45);
            color:#fff;
            background:rgba(255,59,95,.11);
            cursor:pointer;
            font-size:12px;
        }
        .timer-container{
            text-align:center;
            margin:18px 0 22px;
            padding:22px 16px;
            border-radius:26px;
            border:1px solid rgba(0,229,255,.35);
            background:linear-gradient(135deg, rgba(0,229,255,.09), rgba(139,92,246,.08));
        }
        #statusText{
            display:block;
            color:#d8e3f7;
            font-size:13px;
            margin-bottom:8px;
        }
        #timer{
            color:#eaffff;
            font-size:clamp(42px,12vw,64px);
            font-weight:900;
            font-family:monospace;
            text-shadow:0 0 14px rgba(0,229,255,.9);
        }
        .progress-container{display:none;margin:0 0 20px;text-align:center}
        .progress-bar-bg{
            width:100%;height:14px;
            border-radius:999px;
            background:rgba(255,255,255,.08);
            overflow:hidden;
            border:1px solid var(--border);
        }
        .progress-bar-fill{
            height:100%;width:0%;
            background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
            transition:width .2s;
        }
        #progressPercent{display:block;margin-top:7px;color:var(--cyan);font-size:13px;font-weight:800}
        .input-group{margin-bottom:16px}
        label{display:block;margin:0 0 8px;color:#b9c4d7;font-size:14px;font-weight:700}
        .hidden{display:none!important}
        .loop-container{
            display:flex;
            align-items:center;
            gap:13px;
            margin:18px 0 20px;
            padding:13px 16px;
            border-radius:20px;
            cursor:pointer;
            border:1px solid rgba(0,229,255,.2);
            background:rgba(0,229,255,.05);
        }
        .loop-container input{width:auto;cursor:pointer}
        .loop-container label{margin:0;color:#d8fbff;font-size:15px;font-weight:900;cursor:pointer}
        .footer-note{text-align:center;margin-top:16px;color:rgba(220,230,255,.45);font-size:12px}
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-box">
        <div class="brand-badge" style="width:66px;height:66px;margin:0 auto 14px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,rgba(0,229,255,.22),rgba(139,92,246,.25));border:1px solid rgba(255,255,255,.13);font-size:30px">⚡</div>
        <h2>User Login</h2>
        <p class="subtitle">Enter credentials to access panel</p>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<div id="mainPanel">
    <button class="logout-btn" onclick="logout()">Logout</button>
    <div class="panel">
        <h2>LIVE PANEL</h2>
        <div class="timer-container">
            <span id="statusText">Status: Ready to Stream</span>
            <div id="timer">00:00:00</div>
        </div>
        <div id="progressContainer" class="progress-container">
            <div class="progress-bar-bg"><div id="progressFill" class="progress-bar-fill"></div></div>
            <span id="progressPercent">Uploading... 0%</span>
        </div>
        <div class="input-group">
            <label>Source Type</label>
            <select id="sourceType" onchange="toggleSource()">
                <option value="link">🔗 Video / YouTube / Dropbox Link</option>
                <option value="file">📁 Upload Video File</option>
            </select>
        </div>
        <div id="linkInput" class="input-group">
            <label>Video URL</label>
            <input type="text" id="videoSource" placeholder="https://...">
        </div>
        <div id="fileInput" class="input-group hidden">
            <label>Select Video File</label>
            <input type="file" id="videoFile" accept="video/*">
        </div>
        <div class="input-group">
            <label>Live Mode (View Style)</label>
            <select id="liveMode">
                <option value="standard">📺 Standard (Horizontal 16:9)</option>
                <option value="shorts">📱 Shorts (Vertical 9:16)</option>
            </select>
        </div>
        <div class="loop-container">
            <input type="checkbox" id="loopStream">
            <label for="loopStream">🔄 Loop Video (24/7 Live)</label>
        </div>
        <div class="input-group">
            <label>Target Platform</label>
            <select id="platform">
                <option value="rtmp://a.rtmp.youtube.com/live2">🔴 YouTube</option>
                <option value="rtmps://live-api-s.facebook.com:443/rtmp/">🔵 Facebook</option>
            </select>
        </div>
        <div class="input-group">
            <label>Stream Key</label>
            <input type="text" id="streamKey" placeholder="Enter stream key">
        </div>
        <div id="buttonArea">
            <button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>
        </div>
        <div class="footer-note">Premium UI • Railway Ready • High Quality</div>
    </div>
</div>

<script>
    let timerInterval;
    let startTime;
    let sessionToken = localStorage.getItem('live_token');

    window.onload = async () => {
        if (sessionToken) showPanel();
        if (sessionToken) {
            try {
                const response = await fetch(`/status?token=${sessionToken}`);
                const data = await response.json();
                if (data.isActive && data.startTime) {
                    startTime = data.startTime;
                    document.getElementById('statusText').innerText = "Status: Live Stream Started!";
                    document.getElementById('buttonArea').innerHTML = `<button id="stopBtn" class="stop-btn" onclick="stopStream()">Stop Live Stream</button>`;
                    startSyncTimer();
                }
            } catch (e) {}
        }
    };

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if(!user || !pass) { alert("সবগুলো ঘর পূরণ করুন!"); return; }
        
        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass })
            });
            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('live_token', data.token);
                sessionToken = data.token;
                showPanel();
            } else { alert("ভুল ইউজারনেম বা পাসওয়ার্ড!"); }
        } catch (e) { alert("সার্ভারের সাথে কানেক্ট করা যাচ্ছে না!"); }
    }

    function showPanel() {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'flex';
    }

    function logout() { localStorage.removeItem('live_token'); location.reload(); }

    function toggleSource() {
        const type = document.getElementById('sourceType').value;
        document.getElementById('linkInput').classList.toggle('hidden', type === 'file');
        document.getElementById('fileInput').classList.toggle('hidden', type === 'link');
    }

    function startSyncTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const now = Date.now();
            const diff = Math.floor((now - startTime) / 1000);
            let h = Math.floor(diff / 3600);
            let m = Math.floor((diff % 3600) / 60);
            let s = diff % 60;
            document.getElementById('timer').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);
    }

    async function startStream() {
        const btn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const progContainer = document.getElementById('progressContainer');
        const progFill = document.getElementById('progressFill');
        const progPercent = document.getElementById('progressPercent');
        const btnArea = document.getElementById('buttonArea');
        
        const type = document.getElementById('sourceType').value;
        const key = document.getElementById('streamKey').value;
        const platform = document.getElementById('platform').value;
        const loop = document.getElementById('loopStream').checked;
        const mode = document.getElementById('liveMode').value;

        if (!key) { alert("স্ট্রিম কি বসান!"); return; }

        const formData = new FormData();
        formData.append('type', type);
        formData.append('platform', platform);
        formData.append('key', key);
        formData.append('loop', loop);
        formData.append('mode', mode);
        formData.append('token', sessionToken);

        if (type === 'link') {
            formData.append('source', document.getElementById('videoSource').value);
        } else {
            const file = document.getElementById('videoFile').files[0];
            if (!file) { alert("ভিডিও ফাইল সিলেক্ট করুন!"); return; }
            formData.append('videoFile', file);
        }

        btn.innerText = "CONNECTING...";
        btn.disabled = true;
        statusText.innerText = "Status: Processing...";

        const xhr = new XMLHttpRequest();
        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const p = Math.round((e.loaded / e.total) * 100);
                progContainer.style.display = 'block';
                progFill.style.width = p + '%';
                progPercent.innerText = `Uploading... ${p}%`;
                statusText.innerText = `Status: Uploading ${p}%`;
            }
        };

        xhr.onload = () => {
            if (xhr.status === 200) {
                alert("লাইভ শুরু হয়েছে!");
                statusText.innerText = "Status: Live Stream Started!";
                fetch(`/status?token=${sessionToken}`).then(res => res.json()).then(data => {
                    startTime = data.startTime;
                    startSyncTimer();
                });
                btnArea.innerHTML = `<button id="stopBtn" class="stop-btn" onclick="stopStream()">Stop Live Stream</button>`;
            } else {
                alert("সার্ভার এরর!");
                statusText.innerText = "Status: Error Occurred";
                btn.innerText = "Start Live Stream";
                btn.disabled = false;
            }
            setTimeout(() => { progContainer.style.display = 'none'; }, 3000);
        };

        xhr.open('POST', '/start-stream', true);
        xhr.send(formData);
    }

    async function stopStream() {
        const statusText = document.getElementById('statusText');
        const btnArea = document.getElementById('buttonArea');
        if(!confirm("বন্ধ করতে চান?")) return;
        try {
            const response = await fetch('/stop-stream', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: sessionToken })
            });
            if(response.ok) {
                alert("বন্ধ হয়েছে!");
                statusText.innerText = "Status: Ready to Stream";
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = "00:00:00";
                btnArea.innerHTML = `<button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>`;
            }
        } catch (e) { alert("Error!"); }
    }
</script>
</body>
</html>
