<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro High-Quality Live Panel</title>
    <style>

        :root {
            --bg: #030513;
            --card: rgba(15, 20, 49, .82);
            --card2: rgba(20, 27, 64, .72);
            --stroke: rgba(64, 230, 255, .25);
            --stroke2: rgba(177, 105, 255, .18);
            --text: #f6f8ff;
            --muted: rgba(235, 241, 255, .63);
            --cyan: #27e7ff;
            --blue: #5486ff;
            --violet: #965dff;
            --pink: #ff59c7;
            --red: #ff5d6f;
            --green: #2dff9a;
        }
        * { box-sizing: border-box; }
        html { min-height: 100%; background: var(--bg); }
        body {
            min-height: 100vh;
            margin: 0;
            padding: max(10px, env(safe-area-inset-top)) 10px 14px;
            color: var(--text);
            font-family: Inter, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 16% 6%, rgba(39,231,255,.18), transparent 32%),
                radial-gradient(circle at 92% 14%, rgba(255,89,199,.15), transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(84,134,255,.16), transparent 35%),
                linear-gradient(180deg, #030513 0%, #070a1f 48%, #02030d 100%);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,.026) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
            background-size: 34px 34px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,.85), transparent 85%);
        }
        #loginPage {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top left, rgba(39,231,255,.22), transparent 34%),
                radial-gradient(circle at bottom right, rgba(150,93,255,.18), transparent 38%),
                #030513;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 18px;
        }
        .login-box {
            width: min(100%, 350px);
            text-align: center;
            padding: 24px 20px;
            border-radius: 26px;
            background: linear-gradient(145deg, rgba(18,24,58,.88), rgba(7,10,28,.9));
            border: 1px solid rgba(39,231,255,.28);
            box-shadow: 0 24px 70px rgba(0,0,0,.58), inset 0 1px 0 rgba(255,255,255,.08);
            backdrop-filter: blur(18px);
        }
        .login-box h2, h2 {
            margin: 0 0 14px;
            text-align: center;
            color: var(--text);
            font-size: 25px;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 900;
            text-shadow: 0 0 18px rgba(39,231,255,.28);
        }
        .login-box h2::after, .panel h2::after {
            content: "";
            display: block;
            width: 54px;
            height: 4px;
            border-radius: 99px;
            margin: 12px auto 0;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
            box-shadow: 0 0 18px rgba(39,231,255,.46);
        }
        #mainPanel {
            display: none;
            width: min(100%, 390px);
            max-width: 390px;
            position: relative;
            flex-direction: column;
            margin: 0 auto;
        }
        .panel {
            position: relative;
            width: 100%;
            padding: 18px 16px 18px;
            border-radius: 28px;
            background:
                linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.018)),
                linear-gradient(145deg, rgba(19, 26, 62, .86), rgba(7, 10, 31, .92));
            border: 1px solid rgba(39,231,255,.29);
            box-shadow:
                0 26px 75px rgba(0,0,0,.55),
                0 0 0 1px rgba(150,93,255,.10),
                inset 0 1px 0 rgba(255,255,255,.11);
            overflow: hidden;
            backdrop-filter: blur(18px);
        }
        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 0% 0%, rgba(39,231,255,.16), transparent 30%),
                radial-gradient(circle at 100% 12%, rgba(255,89,199,.11), transparent 28%),
                linear-gradient(90deg, rgba(39,231,255,.50), rgba(150,93,255,.08), rgba(255,89,199,.45)) top/100% 1px no-repeat;
        }
        .panel > * { position: relative; z-index: 1; }
        .logout-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 4;
            height: 34px;
            padding: 0 13px;
            border-radius: 999px;
            border: 1px solid rgba(255,93,111,.50);
            background: rgba(255,93,111,.08);
            color: #ff9aa7;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 20px rgba(255,93,111,.11);
        }
        .timer-container {
            text-align: center;
            margin: 0 0 13px;
            padding: 13px 10px 14px;
            min-height: 94px;
            border-radius: 22px;
            border: 1px solid rgba(39,231,255,.30);
            background:
                radial-gradient(circle at center, rgba(39,231,255,.11), transparent 70%),
                rgba(3, 7, 25, .54);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.035), 0 0 26px rgba(39,231,255,.10);
        }
        #statusText {
            display: block;
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
            margin: 1px 0 6px;
        }
        #statusText::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            margin-right: 7px;
            box-shadow: 0 0 12px var(--green);
        }
        #timer {
            color: var(--cyan);
            font-size: clamp(41px, 12vw, 52px);
            font-weight: 900;
            line-height: .98;
            letter-spacing: 4px;
            font-family: 'SFMono-Regular', 'Consolas', 'Courier New', monospace;
            text-shadow: 0 0 13px rgba(39,231,255,.74), 0 0 35px rgba(39,231,255,.26);
        }
        .progress-container { display: none; margin: -3px 0 11px; text-align: center; }
        .progress-bar-bg {
            height: 10px;
            width: 100%;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(9, 13, 35, .9);
            border: 1px solid rgba(39,231,255,.18);
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet));
            box-shadow: 0 0 16px rgba(39,231,255,.55);
            transition: width .2s;
        }
        #progressPercent { display: block; margin-top: 4px; color: var(--cyan); font-size: 11px; font-weight: 800; }
        .input-group { margin-bottom: 10px; }
        label {
            display: block;
            margin: 0 0 5px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.15;
            letter-spacing: .35px;
            font-weight: 800;
        }
        input, select {
            width: 100%;
            height: 43px;
            padding: 0 13px;
            border-radius: 15px;
            border: 1px solid rgba(127, 151, 255, .20);
            background: linear-gradient(180deg, rgba(21, 27, 63, .82), rgba(8, 12, 34, .88));
            color: #ffffff;
            font-size: 15px;
            font-weight: 550;
            outline: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 26px rgba(0,0,0,.17);
            transition: border-color .18s, box-shadow .18s, transform .18s;
        }
        select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 36px;
            background-image:
                linear-gradient(45deg, transparent 50%, var(--cyan) 50%),
                linear-gradient(135deg, var(--cyan) 50%, transparent 50%),
                linear-gradient(180deg, rgba(21, 27, 63, .82), rgba(8, 12, 34, .88));
            background-position: calc(100% - 19px) 18px, calc(100% - 12px) 18px, 0 0;
            background-size: 7px 7px, 7px 7px, 100% 100%;
            background-repeat: no-repeat;
        }
        input:focus, select:focus {
            border-color: rgba(39,231,255,.58);
            box-shadow: 0 0 0 3px rgba(39,231,255,.09), inset 0 1px 0 rgba(255,255,255,.07), 0 12px 26px rgba(0,0,0,.20);
        }
        input::placeholder { color: rgba(232,238,255,.40); }
        .hidden { display: none; }
        .loop-container {
            min-height: 46px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 2px 0 12px;
            padding: 9px 12px;
            border-radius: 17px;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(39,231,255,.12), rgba(150,93,255,.08));
            border: 1px solid rgba(39,231,255,.20);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
        }
        .loop-container input {
            width: 24px;
            height: 24px;
            min-width: 24px;
            padding: 0;
            margin: 0;
            border-radius: 7px;
            accent-color: var(--cyan);
            cursor: pointer;
        }
        .loop-container label {
            margin: 0;
            color: #eaf1ff;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
        }
        .start-btn, .stop-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 18px;
            color: #050816;
            font-size: 14px;
            font-weight: 950;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform .18s, filter .18s, box-shadow .18s;
        }
        .start-btn {
            margin-top: 4px;
            background: linear-gradient(100deg, var(--cyan) 0%, var(--blue) 48%, var(--violet) 100%);
            box-shadow: 0 12px 32px rgba(39,231,255,.22), inset 0 1px 0 rgba(255,255,255,.45);
        }
        .stop-btn {
            margin-top: 4px;
            background: linear-gradient(100deg, #ff465f, #ff8c55);
            color: #fff;
            box-shadow: 0 12px 32px rgba(255,70,95,.24), inset 0 1px 0 rgba(255,255,255,.28);
        }
        .start-btn:active, .stop-btn:active { transform: translateY(1px) scale(.995); }
        button:disabled { opacity: .65; cursor: not-allowed; }
        @media (max-width: 420px) {
            body { padding: 8px 8px 12px; }
            #mainPanel { width: 100%; max-width: 372px; }
            .panel { padding: 17px 14px 16px; border-radius: 25px; }
            h2 { font-size: 23px; letter-spacing: 3.2px; margin-bottom: 12px; }
            .panel h2::after { margin-top: 10px; }
            .timer-container { min-height: 88px; padding: 11px 8px 12px; margin-bottom: 12px; }
            #timer { font-size: 42px; letter-spacing: 3px; }
            input, select { height: 41px; font-size: 14px; border-radius: 14px; }
            label { font-size: 12px; margin-bottom: 4px; }
            .input-group { margin-bottom: 9px; }
            .loop-container { min-height: 43px; padding: 8px 11px; margin-bottom: 10px; }
            .loop-container label { font-size: 13px; }
            .start-btn, .stop-btn { height: 49px; border-radius: 17px; }
            .logout-btn { height: 31px; padding: 0 11px; top: 9px; right: 9px; font-size: 11px; }
        }
        @media (max-height: 720px) {
            body { padding-top: 6px; }
            .panel { padding-top: 14px; padding-bottom: 14px; }
            h2 { font-size: 21px; margin-bottom: 9px; }
            .panel h2::after { height: 3px; width: 48px; margin-top: 8px; }
            .timer-container { min-height: 78px; padding: 9px 8px 10px; margin-bottom: 9px; }
            #statusText { font-size: 12px; margin-bottom: 5px; }
            #timer { font-size: 37px; }
            input, select { height: 38px; font-size: 13px; }
            label { font-size: 11px; }
            .input-group { margin-bottom: 7px; }
            .loop-container { min-height: 39px; margin-bottom: 8px; }
            .start-btn, .stop-btn { height: 45px; }
        }

    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-box">
        <h2>User Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<div id="mainPanel">
    <button class="logout-btn" onclick="logout()">Logout</button>
    <div class="panel">
        <h2>LIVE PANEL</h2>
        <div class="timer-container">
            <span id="statusText">Status: Ready to Stream</span>
            <div id="timer">00:00:00</div>
        </div>
        <div id="progressContainer" class="progress-container">
            <div class="progress-bar-bg"><div id="progressFill" class="progress-bar-fill"></div></div>
            <span id="progressPercent">Uploading... 0%</span>
        </div>
        <div class="input-group">
            <label>Source Type</label>
            <select id="sourceType" onchange="toggleSource()">
                <option value="link">🔗 Video/YouTube/Dropbox Link</option>
                <option value="file">📁 Upload Video File</option>
            </select>
        </div>
        <div id="linkInput" class="input-group">
            <label>Video URL:</label>
            <input type="text" id="videoSource" placeholder="https://...">
        </div>
        <div id="fileInput" class="input-group hidden">
            <label>Select Video File:</label>
            <input type="file" id="videoFile" accept="video/*">
        </div>
        <div class="input-group">
            <label>Live Mode (View Style)</label>
            <select id="liveMode">
                <option value="standard">📺 Standard (Horizontal 16:9)</option>
                <option value="shorts">📱 Shorts (Vertical 9:16)</option>
            </select>
        </div>
        <div class="loop-container">
            <input type="checkbox" id="loopStream">
            <label for="loopStream">🔄 Loop Video (24/7 Live)</label>
        </div>
        <div class="input-group">
            <label>Target Platform</label>
            <select id="platform">
                <option value="rtmp://a.rtmp.youtube.com/live2">🔴 YouTube</option>
                <option value="rtmps://live-api-s.facebook.com:443/rtmp/">🔵 Facebook</option>
            </select>
        </div>
        <div class="input-group">
            <label>Stream Key</label>
            <input type="text" id="streamKey" placeholder="Enter stream key">
        </div>
        <div id="buttonArea">
            <button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>
        </div>
    </div>
</div>

<script>
    let timerInterval;
    let startTime;
    let sessionToken = localStorage.getItem('live_token');

    window.onload = async () => {
        if (sessionToken) showPanel();
        try {
            const response = await fetch(`/status?token=${sessionToken}`);
            const data = await response.json();
            if (data.isActive && data.startTime) {
                startTime = data.startTime;
                document.getElementById('statusText').innerText = "Status: Live Stream Started!";
                document.getElementById('buttonArea').innerHTML = `<button id="stopBtn" class="stop-btn" onclick="stopStream()">Stop Live Stream</button>`;
                startSyncTimer();
            }
        } catch (e) {}
    };

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, pass })
        });
        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('live_token', data.token);
            sessionToken = data.token;
            showPanel();
        } else { alert("ভুল ইউজারনেম বা পাসওয়ার্ড!"); }
    }

    function showPanel() {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainPanel').style.display = 'flex';
    }

    function logout() { localStorage.removeItem('live_token'); location.reload(); }

    function toggleSource() {
        const type = document.getElementById('sourceType').value;
        document.getElementById('linkInput').classList.toggle('hidden', type === 'file');
        document.getElementById('fileInput').classList.toggle('hidden', type === 'link');
    }

    function startSyncTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const now = Date.now();
            const diff = Math.floor((now - startTime) / 1000);
            let h = Math.floor(diff / 3600);
            let m = Math.floor((diff % 3600) / 60);
            let s = diff % 60;
            document.getElementById('timer').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);
    }

    async function startStream() {
        const btn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const progContainer = document.getElementById('progressContainer');
        const progFill = document.getElementById('progressFill');
        const progPercent = document.getElementById('progressPercent');
        const btnArea = document.getElementById('buttonArea');
        
        const type = document.getElementById('sourceType').value;
        const key = document.getElementById('streamKey').value;
        const platform = document.getElementById('platform').value;
        const loop = document.getElementById('loopStream').checked;
        const mode = document.getElementById('liveMode').value;

        if (!key) { alert("স্ট্রিম কি বসান!"); return; }

        const formData = new FormData();
        formData.append('type', type);
        formData.append('platform', platform);
        formData.append('key', key);
        formData.append('loop', loop);
        formData.append('mode', mode);
        formData.append('token', sessionToken);

        if (type === 'link') {
            formData.append('source', document.getElementById('videoSource').value);
        } else {
            const file = document.getElementById('videoFile').files[0];
            if (!file) { alert("ভিডিও ফাইল সিলেক্ট করুন!"); return; }
            formData.append('videoFile', file);
        }

        btn.innerText = "CONNECTING...";
        btn.disabled = true;
        statusText.innerText = "Status: Processing...";

        const xhr = new XMLHttpRequest();
        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const p = Math.round((e.loaded / e.total) * 100);
                progContainer.style.display = 'block';
                progFill.style.width = p + '%';
                progPercent.innerText = `Uploading... ${p}%`;
                statusText.innerText = `Status: Uploading ${p}%`;
            }
        };

        xhr.onload = () => {
            if (xhr.status === 200) {
                alert("লাইভ শুরু হয়েছে!");
                statusText.innerText = "Status: Live Stream Started!";
                fetch(`/status?token=${sessionToken}`).then(res => res.json()).then(data => {
                    startTime = data.startTime;
                    startSyncTimer();
                });
                btnArea.innerHTML = `<button id="stopBtn" class="stop-btn" onclick="stopStream()">Stop Live Stream</button>`;
            } else {
                alert("সার্ভার এরর!");
                statusText.innerText = "Status: Error Occurred";
                btn.innerText = "Start Live Stream";
                btn.disabled = false;
            }
            setTimeout(() => { progContainer.style.display = 'none'; }, 3000);
        };

        xhr.open('POST', '/start-stream', true);
        xhr.send(formData);
    }

    async function stopStream() {
        const statusText = document.getElementById('statusText');
        const btnArea = document.getElementById('buttonArea');
        if(!confirm("বন্ধ করতে চান?")) return;
        try {
            const response = await fetch('/stop-stream', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: sessionToken })
            });
            if(response.ok) {
                alert("বন্ধ হয়েছে!");
                statusText.innerText = "Status: Ready to Stream";
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = "00:00:00";
                btnArea.innerHTML = `<button id="startBtn" class="start-btn" onclick="startStream()">Start Live Stream</button>`;
            }
        } catch (e) { alert("Error!"); }
    }
</script>
</body>
</html>
