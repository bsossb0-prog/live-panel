<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Live Stream Panel</title>
    <style>
        body { background-color: #050510; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .panel { background-color: #111125; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 400px; border: 1px solid #1a1a3a; }
        h2 { text-align: center; color: #00d2ff; font-size: 22px; letter-spacing: 1px; margin-bottom: 30px; text-transform: uppercase; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #aaa; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2a4a; background: #1a1a3a; color: white; font-size: 14px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #00d2ff; box-shadow: 0 0 5px #00d2ff; }
        .play-container { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 30px 0; }
        .circle-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #333; display: flex; justify-content: center; align-items: center; cursor: pointer; background: #1a1a3a; color: white; font-size: 12px; }
        .main-play-btn { width: 80px; height: 80px; background-color: #1a1a3a; border: 3px solid #333; font-size: 30px; }
        .main-play-btn:hover { border-color: #00d2ff; color: #00d2ff; }
        .start-btn { width: 100%; padding: 15px; background-color: #00d2ff; border: none; border-radius: 8px; color: #050510; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="panel">
    <h2>ADD NEW STREAM</h2>
    
    <div class="input-group">
        <label>Stream Name</label>
        <input type="text" id="streamName" placeholder="Stream 68215b97">
    </div>

    <div class="input-group">
        <label>Source Type</label>
        <select id="sourceType">
            <option value="link">🔗 Video/YouTube Link</option>
            <option value="file">📁 Local Video File</option>
        </select>
    </div>

    <div class="input-group">
        <label>Video Source (URL or Path):</label>
        <input type="text" id="videoSource" placeholder="https://youtube.com/watch?v=...">
    </div>

    <div class="input-group">
        <label>Target Platform</label>
        <select id="platform">
            <option value="rtmp://a.rtmp.youtube.com/live2">🔴 YouTube</option>
            <option value="rtmps://live-api-s.facebook.com:443/rtmp/">🔵 Facebook</option>
        </select>
    </div>

    <div class="input-group">
        <label>Stream Key</label>
        <input type="text" id="streamKey" placeholder="Enter stream key here">
    </div>

    <div class="play-container">
        <div class="circle-btn">🔄 10</div>
        <div class="circle-btn main-play-btn" onclick="startStream()">▶</div>
        <div class="circle-btn">🔄 10</div>
    </div>

    <button class="start-btn" onclick="startStream()">Start Live Stream</button>
</div>

<script>
    async function startStream() {
        const data = {
            type: document.getElementById('sourceType').value,
            source: document.getElementById('videoSource').value,
            platform: document.getElementById('platform').value,
            key: document.getElementById('streamKey').value
        };

        const response = await fetch('/start-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.text();
        alert(result);
    }
</script>

</body>
</html>
